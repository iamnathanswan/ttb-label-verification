name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint, test, spec coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -q

      # The spec is part of the deliverable: every buildable requirement must be
      # claimed by a task, and no document may cite an ID that does not exist.
      - name: Requirement coverage
        run: python3 docs/check_coverage.py

      # Fails when a buildable requirement has no covering test, so an untested
      # requirement breaks the build rather than surviving to submission.
      - name: Traceability
        run: python3 scripts/gen_traceability.py --check

  frontend:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci || npm install

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build
